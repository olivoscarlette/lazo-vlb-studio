services:
  - type: web
    name: lazo-vlb-studio
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: lazo-persistent-data
      mountPath: /app/data
      sizeGB: 5
